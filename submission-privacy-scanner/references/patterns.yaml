# Privacy Scanner - Detection Patterns Registry
# Each pattern: id, name, category, regex, risk_level, description, suggestion

categories:
  contact:
    label: "联系方式"
    icon: "📞"
  identity:
    label: "身份信息"
    icon: "🪪"
  web_trace:
    label: "网络痕迹"
    icon: "🌐"
  secrets:
    label: "密钥令牌"
    icon: "🔑"
  path_leak:
    label: "路径泄露"
    icon: "📁"
  placeholder:
    label: "占位符残留"
    icon: "📝"

patterns:
  # === 联系方式 ===
  - id: email
    name: "电子邮箱"
    category: contact
    risk: high
    regex: '\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b'
    description: "邮箱地址可能暴露真实身份"
    suggestion: "删除或替换为匿名邮箱"
    exclude_regex:
      - 'example\.com$'
      - 'your@email\.com$'
      - '\.edu\.cn\b.*引用'

  - id: cn_phone
    name: "中国手机号"
    category: contact
    risk: high
    regex: '(?<!\d)1[3-9]\d{9}(?!\d)'
    description: "手机号是强个人标识信息"
    suggestion: "立即删除"

  - id: cn_telephone
    name: "固定电话"
    category: contact
    risk: medium
    regex: '(?<!\d)(?:0\d{2,3})[-\s]?\d{7,8}(?!\d)'
    description: "固话号码可能关联具体地址"
    suggestion: "删除或确认是否为公开联系电话"

  # === 身份信息 ===
  - id: cn_id_card
    name: "身份证号"
    category: identity
    risk: high
    regex: '(?<!\d)[1-9]\d{5}(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[\dXx](?!\d)'
    description: "身份证号是核心隐私信息"
    suggestion: "立即删除"

  - id: long_number
    name: "长数字串(疑似学号/工号)"
    category: identity
    risk: medium
    regex: '(?<!\d)\d{8,12}(?!\d)'
    description: "8-12位纯数字可能是学号或工号"
    suggestion: "确认是否为学号/工号，如是则删除"
    context_required: true

  # === 网络痕迹 ===
  - id: url_general
    name: "URL链接"
    category: web_trace
    risk: medium
    regex: 'https?://[^\s\)）\]】\u3002\uff0c\uff01\uff1f"''<>]+'
    description: "URL可能暴露个人项目、社交账号等"
    suggestion: "检查链接是否包含个人信息，学术引用URL可保留"
    exclude_regex:
      - 'arxiv\.org'
      - 'doi\.org'
      - 'scholar\.google'
      - 'wikipedia\.org'
      - 'rfc\.editor'
      - 'github\.com/[^/]+/[^/]+/issues'
      - 'stackoverflow\.com'

  - id: github_profile
    name: "GitHub个人链接"
    category: web_trace
    risk: high
    regex: 'https?://github\.com/[A-Za-z0-9\-]+(?:(?:/[A-Za-z0-9_.\-]+)?(?:\s|$|[)\]）】]))'
    description: "GitHub链接直接暴露用户名"
    suggestion: "删除或替换为匿名仓库"

  - id: social_media
    name: "社交媒体账号"
    category: web_trace
    risk: high
    regex: '(?:微信|wx|wechat|qq|微博|weibo|twitter|instagram|telegram)[：:]\s*[A-Za-z0-9_\-]{3,}'
    description: "社交媒体账号暴露真实身份"
    suggestion: "删除"

  # === 密钥令牌 ===
  - id: api_key_generic
    name: "API密钥/令牌"
    category: secrets
    risk: high
    regex: '(?:sk|pk|ak|key|token|secret|api_key|apikey|access_token)[_\-\s]*[=:]\s*["\x27]?[A-Za-z0-9_\-]{16,}'
    description: "API密钥泄露可能导致安全风险"
    suggestion: "立即删除并轮换密钥"

  - id: api_key_prefixed
    name: "已知前缀的密钥"
    category: secrets
    risk: high
    regex: '(?:sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{36}|AKIA[A-Z0-9]{16}|xox[baprs]-[A-Za-z0-9\-]+)'
    description: "OpenAI/GitHub/AWS/Slack等平台的密钥"
    suggestion: "立即删除并在对应平台轮换密钥"

  - id: private_key_block
    name: "私钥块"
    category: secrets
    risk: high
    regex: '-----BEGIN[A-Z ]*PRIVATE KEY-----'
    description: "加密私钥绝对不能出现在提交文件中"
    suggestion: "立即删除整个私钥块"

  - id: password_pattern
    name: "密码字段"
    category: secrets
    risk: high
    regex: '(?:password|passwd|pwd|pass)[\s_\-]*[=:]\s*["\x27]?[^\s"''{]{3,}'
    description: "密码字段泄露"
    suggestion: "立即删除"

  # === 路径泄露 ===
  - id: windows_user_path
    name: "Windows用户路径"
    category: path_leak
    risk: medium
    regex: '[A-Z]:\\Users\\[A-Za-z][A-Za-z0-9_\-]*\\'
    description: "暴露本地用户名"
    suggestion: "替换为相对路径或通用路径"
    exclude_regex:
      - 'C:\\Users\\Public\\'
      - 'C:\\Users\\Default\\'
      - 'C:\\Users\\All Users\\'

  - id: unix_user_path
    name: "Unix/Mac用户路径"
    category: path_leak
    risk: medium
    regex: '/(?:home|Users)/[A-Za-z][A-Za-z0-9_\-]*/'
    description: "暴露本地用户名"
    suggestion: "替换为相对路径或 ~/"

  # === 占位符残留 ===
  - id: todo_fixme
    name: "TODO/FIXME标记"
    category: placeholder
    risk: low
    regex: '(?:TODO|FIXME|HACK|XXX|CHANGED|TEMP)\b[:\s]'
    description: "说明文档未完成"
    suggestion: "完成内容或删除标记"

  - id: template_placeholder
    name: "模板占位符"
    category: placeholder
    risk: medium
    regex: '(?:\[your\s+\w+\]|\[INSERT[^\]]*\]|\[在此[^\]]*\]|填写姓名|在此输入|your[_\s]name|your[_\s]email|在此填写|请替换)'
    description: "模板内容未替换"
    suggestion: "替换为实际内容"

  - id: latex_author_realname
    name: "LaTeX作者字段"
    category: identity
    risk: high
    regex: '\\\\author\{[^}]+\}'
    description: "LaTeX论文中的作者姓名，需确认是否为笔名"
    suggestion: "确认是否为笔名/匿名，如为真名则替换"
